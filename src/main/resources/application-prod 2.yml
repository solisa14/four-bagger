# Production profile. Secrets and connection strings must be injected at runtime
# (e.g. AWS Secrets Manager → ECS task environment / secrets). Do not bake them
# into the image.
#
# Required environment variables:
#   SPRING_DATASOURCE_URL       JDBC URL including TLS, e.g.
#                              jdbc:postgresql://host:5432/fourbagger?sslmode=require
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   JWT_SECRET                 high-entropy secret (≥ 32 bytes when Base64-decoded
#                              or ≥ 32 raw characters)
#   ALLOWED_ORIGINS            comma-separated browser origins (Vercel production URL)
# Optional:
#   REGISTRATION_ENABLED       true|false (default true)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
    cookie:
      secure: true
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
