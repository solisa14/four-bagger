spring:
  datasource:
    url: ${DEV_DB_URL:jdbc:postgresql://localhost:5432/fourbagger}
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  security:
    jwt:
      # dev-only, 256-bit placeholder -- override JWT_SECRET for any shared environment
      secret-key: ${JWT_SECRET:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
    cookie:
      secure: false
