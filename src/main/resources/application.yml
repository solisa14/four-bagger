spring:
  application:
    name: four-bagger-api
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: true

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  auth:
    registration:
      enabled: ${REGISTRATION_ENABLED:true}
  rate-limit:
    enabled: true
    auth:
      requests: ${RATE_LIMIT_AUTH_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
    join-code:
      requests: ${RATE_LIMIT_JOIN_CODE_REQUESTS:30}
      window-seconds: ${RATE_LIMIT_JOIN_CODE_WINDOW_SECONDS:60}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration-ms: 3600000 # 1 hour
      refresh-token:
        expiration-ms: 604800000 # 7 days
    cookie:
      secure: true
