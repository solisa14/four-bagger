# Test configuration - overrides main application.yml during tests
spring:
  application:
    name: four-bagger-api
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///fourbagger
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  task:
    scheduling:
      enabled: false
  web:
    error:
      include-message: always
      include-binding-errors: always

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
  auth:
    registration:
      enabled: true
  rate-limit:
    enabled: true
    auth:
      requests: 10000
      window-seconds: 60
    join-code:
      requests: 10000
      window-seconds: 60
  security:
    jwt:
      # test-only, 256-bit placeholder — DO NOT use in prod
      secret-key: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      expiration-ms: 3600000
      refresh-token:
        expiration-ms: 604800000
    cookie:
      secure: false

server:
  port: 8080

logging:
  level:
    root: WARN
